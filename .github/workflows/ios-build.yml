name: Force Unzip Repository

on:
  workflow_dispatch:

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Unpack Code
      run: |
        unzip -o ios.zip || unzip -o *.zip
        rm -f *.zip
        
    - name: Commit Unpacked Folders
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Cleanly extracted source code folders"
